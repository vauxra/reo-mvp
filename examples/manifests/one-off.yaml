apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: reo-one-off-hello-
  namespace: reo-runs
  labels:
    reo.io/example: one-off
spec:
  activeDeadlineSeconds: 60
  automountServiceAccountToken: false
  serviceAccountName: reo-workflow
  executor:
    serviceAccountName: reo-executor
  entrypoint: hello
  templates:
    - name: hello
      container:
        image: python@sha256:42825e7ec3437b3bce923c237484eb23d32128476e18307d2f48951bf86f1db2
        command: [python, -c]
        args:
          - |
            import json
            import platform
            print(json.dumps({"event": "reo_hello", "message": "REO Python one-off passed", "python": platform.python_version()}))
            print("REO_HEARTBEAT=one-off")
            print("REO_AUDIT_MARKER=one-off")
