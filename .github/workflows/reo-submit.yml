name: REO submit

on:
  push:
    branches: [main]
    paths:
      - "examples/manifests/**"
      - ".github/workflows/reo-submit.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: reo-mvp
  AKS_NAME: reo-mvp-aks

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Azure OIDC login
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Kubernetes clients
        run: |
          az aks install-cli \
            --install-location "$RUNNER_TEMP/kubectl" \
            --kubelogin-install-location "$RUNNER_TEMP/kubelogin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Get restricted AKS credentials
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --file "$KUBECONFIG" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli --kubeconfig "$KUBECONFIG"
          kubectl auth can-i create workflows.argoproj.io -n reo-runs

      - name: Submit REO examples
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl create -f examples/manifests/one-off.yaml
          kubectl apply -f examples/manifests/cron.yaml
